<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Volyna Tram GIS - Web</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #121212; }
        #map { height: 100vh; width: 100vw; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: rgba(30, 30, 30, 0.85); color: #fff; padding:   12px 18px;
            border-radius: 8px; font-family: sans-serif; backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

<div class="info-panel">
    <h3 style="margin:0 0 5px 0;">volyna_tram</h3>
    <span id="status">Ładowanie...</span>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const map = L.map('leaflet-map', {
            zoomControl: false
        }).setView([52.2297, 21.0122], 12);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap & CARTO'
        }).addTo(map);

        fetch('config.json')
            .then(r => r.json())
            .then(config => {
                const ip = config.server_ip || '127.0.0.1:8080';
                return fetch(`http://${ip}/api/network/map`);
            })
            .then(r => r.json())
            .then(geoJson => {
                L.geoJSON(geoJson, {
                    style: { color: '#ff2d55', weight: 2, opacity: 0.6 }
                }).addTo(map);
            })
            .catch(e => console.error("Błąd ładowania podkładu Leaflet:", e));
    });
</script>
</body>
</html>
