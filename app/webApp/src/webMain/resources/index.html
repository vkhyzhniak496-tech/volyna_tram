<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volyna_tram</title>
    <link type="text/css" rel="stylesheet" href="styles.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* 2. Warstwa z mapą Leaflet pod spodem */
        #leaflet-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Pod płótnem Compose */
        }

        /* 3. Płótno Compose Wasm nakładane na mapę (z przezroczystym tłem!) */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2; /* Ponad mapą Leafleta */
            pointer-events: auto; /* Obsługa kliknięć */
        }
    </style>
</head>
<body>

<div id="leaflet-map"></div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        // Inicjalizacja Leaflet pod spodem z ciemnym motywem CartoDB
        const map = L.map('leaflet-map', {
            zoomControl: false // Wyłączamy przyciski powiększenia, żeby nie przeszkadzały
        }).setView([52.2297, 21.0122], 12);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Pobieramy geometrię z Ktor-a
        fetch('/api/network/map')
            .then(r => r.json())
            .then(geoJson => {
                L.geoJSON(geoJson, {
                    style: { color: '#ff2d55', weight: 2, opacity: 0.6 }
                }).addTo(map);
            })
            .catch(e => console.error("Błąd ładowania podkładu Leaflet:", e));
    });
</script>

<script type="application/javascript" src="webApp.js"></script>
</body>
</html>
